[package]
name = "tic"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tic"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }

[dev-dependencies]
tempfile = "3"
